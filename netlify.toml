# Netlify configuration for Telux (TanStack Start SSR app).
#
# Nitro 3's Netlify preset writes:
#   - Static client assets to `dist/` (the publish dir).
#   - The SSR handler to `.netlify/functions-internal/server` (Functions v2).
# Netlify auto-discovers anything under `.netlify/functions-internal/` and
# exposes it as a Function with the same name. The redirect below sends
# every non-asset path to that function so client-side routes survive hard
# reloads. The security-headers block mirrors vercel.json so the deployed
# site gets the same protections on Netlify that it gets on Vercel.

[build]
  # Same as the dev workflow. The `nitro.preset = "netlify"` value in
  # vite.config.ts selects this preset at build time.
  command = "npm run build"
  # Static client assets. The SSR function lives at
  # `.netlify/functions-internal/server` and is auto-discovered by Netlify.
  publish = "dist"

# All non-asset paths → the SSR function. `force = false` lets static
# assets (e.g. /assets/foo.js) serve directly from the publish dir.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions-internal/server"
  status = 200
  force = false

# Security headers — mirror vercel.json so the deployed site gets the
# same protections on Netlify that it gets on Vercel.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), interest-cohort=()"

# Cache hashed assets for a year. Nitro emits them under /assets/.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache server responses (the chat proxy in particular).
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
